<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Login — BIMSCOPE</title>
  <meta name="description" content="Sign in to BIMSCOPE to access the IFC Viewer." />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/indexstyle.css" />
  <link rel="stylesheet" href="./src/auth.css" />
</head>

<body>

  <!-- ── Navbar ── -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="./index.html" class="nav-brand">
        <img src="./assets/logo.png" alt="BIMSCOPE" />
        <span>BIMSCOPE</span>
      </a>
      <div class="nav-links">
        <button id="langToggle" class="lang-toggle" title="Switch Language">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langToggleLabel">EN</span>
        </button>
      </div>
    </div>
  </nav>


  <!-- ── Login Form ── -->
  <main class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="./assets/logo.png" alt="BIMSCOPE" />
        <span>BIMSCOPE</span>
      </div>

      <div class="auth-header">
        <h1 data-i18n="login_title">Welcome back</h1>
        <p data-i18n="login_subtitle">Sign in to access the IFC Viewer</p>
      </div>

      <!-- Google Sign-In -->
      <button id="btnGoogle" class="auth-btn auth-btn--google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span class="btn-text" data-i18n="login_google">Sign in with Google</span>
        <span class="auth-spinner"></span>
      </button>

      <div class="auth-divider">
        <span data-i18n="login_or">or</span>
      </div>

      <!-- Email/Password Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email" data-i18n="login_email_label">Email</label>
          <input id="email" type="email" autocomplete="email" required data-i18n="login_email_placeholder" placeholder="name@example.com" />
        </div>

        <div class="auth-field">
          <label for="password" data-i18n="login_password_label">Password</label>
          <div class="auth-field-password">
            <input id="password" type="password" autocomplete="current-password" required data-i18n="login_password_placeholder" placeholder="Enter your password" />
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="authError" class="auth-error"></div>

        <button id="btnLogin" class="auth-btn auth-btn--primary" type="submit">
          <span class="btn-text" data-i18n="login_submit">Sign In</span>
          <span class="auth-spinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        <p><span data-i18n="login_no_account">Don't have an account?</span> <a href="./register.html" data-i18n="login_register_link">Sign up</a></p>
        <a href="./index.html" class="auth-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span data-i18n="login_back">Back to homepage</span>
        </a>
      </div>

    </div>
  </main>


  <script type="module">
  import {
    auth,
    googleProvider,
    signInWithPopup,
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from './src/firebase.js';

  // If already logged in, redirect to app
  onAuthStateChanged(auth, function (user) {
    if (user) {
      window.location.href = './app.html';
    }
  });

  // ── Google Sign-In ──
  var btnGoogle = document.getElementById('btnGoogle');
  btnGoogle.addEventListener('click', async function () {
    btnGoogle.classList.add('is-loading');
    hideError();
    try {
      await signInWithPopup(auth, googleProvider);
      window.location.href = './app.html';
    } catch (err) {
      showError(getErrorMessage(err.code));
    } finally {
      btnGoogle.classList.remove('is-loading');
    }
  });

  // ── Email/Password Sign-In ──
  var form = document.getElementById('loginForm');
  var btnLogin = document.getElementById('btnLogin');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      showError(currentLang === 'th' ? 'กรุณากรอกอีเมลและรหัสผ่าน' : 'Please enter your email and password.');
      return;
    }

    btnLogin.classList.add('is-loading');
    btnLogin.disabled = true;
    hideError();

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = './app.html';
    } catch (err) {
      showError(getErrorMessage(err.code));
    } finally {
      btnLogin.classList.remove('is-loading');
      btnLogin.disabled = false;
    }
  });

  // ── Password Toggle ──
  document.querySelectorAll('.password-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = btn.previousElementSibling;
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  // ── Error Handling ──
  var errorEl = document.getElementById('authError');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('is-visible');
  }

  function hideError() {
    errorEl.classList.remove('is-visible');
  }

  function getErrorMessage(code) {
    var messages = {
      en: {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/popup-closed-by-user': 'Sign-in popup was closed.',
        'default': 'An error occurred. Please try again.'
      },
      th: {
        'auth/user-not-found': 'ไม่พบบัญชีที่ใช้อีเมลนี้',
        'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่',
        'auth/invalid-email': 'กรุณากรอกอีเมลที่ถูกต้อง',
        'auth/too-many-requests': 'ลองมากเกินไป กรุณาลองใหม่ภายหลัง',
        'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
        'auth/popup-closed-by-user': 'หน้าต่างเข้าสู่ระบบถูกปิด',
        'default': 'เกิดข้อผิดพลาด กรุณาลองใหม่'
      }
    };
    var lang = currentLang || 'en';
    var dict = messages[lang] || messages.en;
    return dict[code] || dict['default'];
  }


  // ── i18n ──
  var T = {
    en: {
      login_title: 'Welcome back',
      login_subtitle: 'Sign in to access the IFC Viewer',
      login_google: 'Sign in with Google',
      login_or: 'or',
      login_email_label: 'Email',
      login_email_placeholder: 'name@example.com',
      login_password_label: 'Password',
      login_password_placeholder: 'Enter your password',
      login_submit: 'Sign In',
      login_no_account: "Don't have an account?",
      login_register_link: 'Sign up',
      login_back: 'Back to homepage'
    },
    th: {
      login_title: 'ยินดีต้อนรับกลับ',
      login_subtitle: 'เข้าสู่ระบบเพื่อใช้งาน IFC Viewer',
      login_google: 'เข้าสู่ระบบด้วย Google',
      login_or: 'หรือ',
      login_email_label: 'อีเมล',
      login_email_placeholder: 'name@example.com',
      login_password_label: 'รหัสผ่าน',
      login_password_placeholder: 'กรอกรหัสผ่านของคุณ',
      login_submit: 'เข้าสู่ระบบ',
      login_no_account: 'ยังไม่มีบัญชี?',
      login_register_link: 'สมัครสมาชิก',
      login_back: 'กลับหน้าหลัก'
    }
  };

  var currentLang = 'en';

  function applyLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    var label = document.getElementById('langToggleLabel');
    if (label) label.textContent = lang === 'en' ? 'EN' : 'TH';
    var dict = T[lang] || T.en;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (!dict[key]) return;
      if (el.tagName === 'INPUT') {
        el.placeholder = dict[key];
      } else {
        var svg = el.querySelector('svg');
        if (svg) {
          el.textContent = '';
          el.appendChild(document.createTextNode(dict[key] + ' '));
          el.appendChild(svg);
        } else {
          el.innerHTML = dict[key];
        }
      }
    });
  }

  document.getElementById('langToggle').addEventListener('click', function () {
    applyLang(currentLang === 'en' ? 'th' : 'en');
  });

  var saved = localStorage.getItem('ifc-inspector-language');
  if (saved && (saved === 'en' || saved === 'th')) {
    applyLang(saved);
  }
  </script>

</body>

</html>
